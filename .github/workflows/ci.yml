on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Construir imagen Docker
        run: docker build -t isur-deployment-app .

      - name: Crear variables no sensibles para validacion
        run: |
          printf 'APP_DOMAIN=example.com\nMYSQL_ROOT_PASSWORD=solo-para-ci-no-publicar\n' > .env

      - name: Validar Docker Compose
        run: docker compose -f compose.yaml --env-file .env config --quiet

      - name: Levantar servicios
        run: docker compose up -d

      - name: Verificar contenedores
        run: docker ps